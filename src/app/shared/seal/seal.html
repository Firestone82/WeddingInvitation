<svg viewBox="0 0 100 100">
  <defs>
    <radialGradient [attr.id]="id + 'wax'" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#a23a48" />
      <stop offset="0.55" stop-color="#7a2331" />
      <stop offset="1" stop-color="#4e111b" />
    </radialGradient>
    <radialGradient [attr.id]="id + 'press'" cx="65%" cy="70%" r="80%">
      <stop offset="0" stop-color="#8f2e3c" />
      <stop offset="1" stop-color="#5a1621" />
    </radialGradient>
    <filter [attr.id]="id + 'shadow'" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2" flood-color="#2a0a10" flood-opacity="0.45" />
    </filter>
  </defs>

  <path
    [attr.fill]="'url(#' + id + 'wax)'"
    [attr.filter]="'url(#' + id + 'shadow)'"
    d="M95.4 50.0 C95.4 54.2 93.7 58.3 92.7 62.5 C91.7 66.8 91.4 71.5 89.5 75.4 C87.6 79.3 84.3 82.7 81.2 86.0 C78.1 89.3 74.8 93.9 70.7 95.4 C66.6 96.9 61.0 95.4 56.5 95.1 C52.0 94.8 48.0 94.1 43.7 93.6 C39.4 93.1 34.5 93.8 30.8 92.1 C27.0 90.3 24.2 86.2 21.2 83.2 C18.2 80.2 14.9 77.5 12.7 74.0 C10.4 70.5 8.8 66.4 7.7 62.4 C6.5 58.4 6.0 54.2 5.8 50.0 C5.5 45.8 5.3 41.4 6.0 37.1 C6.7 32.8 7.8 28.1 9.8 24.2 C11.8 20.2 14.6 15.8 18.2 13.3 C21.8 10.8 27.2 10.8 31.4 9.2 C35.6 7.6 39.1 4.8 43.3 3.7 C47.6 2.5 52.5 1.5 56.9 2.1 C61.2 2.8 65.5 5.4 69.3 7.6 C73.2 9.9 76.4 12.8 79.9 15.5 C83.5 18.2 88.7 20.1 90.8 23.8 C92.8 27.5 91.5 33.2 92.2 37.6 C93.0 42.0 95.3 45.8 95.4 50.0Z"
  />
  <!-- pressed disc -->
  <circle cx="50" cy="49" r="33" [attr.fill]="'url(#' + id + 'press)'" />
  <circle cx="50" cy="49" r="33" fill="none" stroke="#c45a67" stroke-opacity="0.45" stroke-width="1.2" />
  <circle cx="50" cy="49" r="28.5" fill="none" stroke="#3d0c14" stroke-opacity="0.5" stroke-width="0.8" stroke-dasharray="0.8 2.2" />

  <!-- embossed initials: dark shadow, then lit face -->
  <g font-family="'Bodoni Moda Variable', 'Bodoni 72', Didot, serif" font-style="italic" font-weight="700" text-anchor="middle">
    <text x="50.8" y="59.8" font-size="27" fill="#2e0910" fill-opacity="0.7" stroke="#2e0910" stroke-opacity="0.5" stroke-width="0.9">{{ initials()[0] }}<tspan font-size="17" dx="1">&amp;</tspan><tspan dx="1">{{ initials()[1] }}</tspan></text>
    <text x="50" y="59" font-size="27" fill="#e3a0a7" stroke="#e3a0a7" stroke-width="0.9" stroke-linejoin="round">{{ initials()[0] }}<tspan font-size="17" dx="1">&amp;</tspan><tspan dx="1">{{ initials()[1] }}</tspan></text>
  </g>
  <!-- specular highlight on the wax -->
  <ellipse cx="33" cy="22" rx="11" ry="4.5" fill="#fff" fill-opacity="0.13" transform="rotate(-28 33 22)" />
</svg>
