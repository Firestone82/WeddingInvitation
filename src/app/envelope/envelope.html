<!-- warm window light on a linen table -->
<div class="light" aria-hidden="true"></div>

<!-- soft leaf shadows, as if the sun comes through a tree outside -->
<div class="leaves" aria-hidden="true">
  <svg class="leaf leaf-a" viewBox="0 0 400 300">
    <defs>
      <filter id="leafBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" />
      </filter>
    </defs>
    <g filter="url(#leafBlur)">
      <path [attr.d]="branchA.stem" fill="none" stroke="currentColor" stroke-width="3" />
      <path [attr.d]="branchA.leaves" fill="currentColor" />
    </g>
  </svg>
  <svg class="leaf leaf-b" viewBox="0 0 400 340">
    <g filter="url(#leafBlur)">
      <path [attr.d]="branchB.stem" fill="none" stroke="currentColor" stroke-width="3" />
      <path [attr.d]="branchB.leaves" fill="currentColor" />
    </g>
  </svg>
</div>

<div class="stage">
  <div class="scene">
    <div class="arrive">
      <div class="float">
        <div #tilt class="tilt">
          <button
            #envelope
            type="button"
            class="envelope"
            [attr.aria-label]="openLabel()"
            [disabled]="opened()"
            (click)="open()"
            (pointerdown)="press(true)"
            (pointerup)="press(false)"
            (pointercancel)="press(false)"
            (pointerleave)="press(false)"
          >
            <!-- inside of the back, with the liner -->
            <span class="part env-back"></span>

            <!-- the card that slides out -->
            <span #letter class="letter">
              <span #letterInner class="letter-inner">
                <span class="letter-names">{{ names()[0] }} <span class="script-amp">&amp;</span> {{ names()[1] }}</span>
                <span class="letter-rule"></span>
                <span class="letter-date">{{ dateLine() }}</span>
              </span>
            </span>

            <!-- front pocket: side flaps + bottom flap -->
            <svg class="part env-pocket" viewBox="0 0 141 100" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <linearGradient id="pocketSide" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#2c5446" />
                  <stop offset="1" stop-color="#20403a" />
                </linearGradient>
                <linearGradient id="pocketBottom" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#2f5a4b" />
                  <stop offset="1" stop-color="#244a3e" />
                </linearGradient>
              </defs>
              <path d="M0 0 L71 55 L0 100Z" fill="url(#pocketSide)" />
              <path d="M141 0 L70 55 L141 100Z" fill="url(#pocketSide)" />
              <path d="M0 100 L66 50 Q70.5 47 75 50 L141 100Z" fill="url(#pocketBottom)" />
              <path d="M0 100 L66 50 Q70.5 47 75 50 L141 100" fill="none" stroke="#132a22" stroke-opacity="0.35" stroke-width="0.6" vector-effect="non-scaling-stroke" />
              <path d="M0 100 L66 50.6 Q70.5 47.6 75 50.6 L141 100" fill="none" stroke="#6f9483" stroke-opacity="0.25" stroke-width="0.6" vector-effect="non-scaling-stroke" transform="translate(0 0.8)" />
              <path d="M0 0 L71 55 M141 0 L70 55" fill="none" stroke="#132a22" stroke-opacity="0.25" stroke-width="0.6" vector-effect="non-scaling-stroke" />
            </svg>

            <!-- handwritten address -->
            <span class="part recipient">{{ recipient() }}</span>

            <!-- top flap -->
            <span class="part flap-shadow"></span>
            <span class="part flap-wrap">
              <span class="flap">
                <span class="flap-liner"></span>
                <span class="flap-shade"></span>
              </span>
            </span>

            <!-- wax seal, split along a crack -->
            <span #seal class="seal">
              <span class="seal-ring"></span>
              <span class="seal-half seal-left"><app-seal [initials]="initials()" /></span>
              <span class="seal-half seal-right"><app-seal [initials]="initials()" /></span>
              <svg class="crack" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <path pathLength="1" d="M54 -2 L49 18 L56 34 L47 52 L55 70 L48 86 L52 102" />
              </svg>
            </span>

            <!-- paper grain and a sheen that follows the light -->
            <span class="part grain"></span>
            <span class="part sheen"></span>
          </button>
        </div>
      </div>
    </div>
    <span class="ground" aria-hidden="true"></span>
  </div>

  <p class="hint" aria-hidden="true">
    <span class="hint-touch">{{ hintTouch() }}</span>
    <span class="hint-mouse">{{ hintMouse() }}</span>
  </p>
</div>

<!-- the card, lifted out and grown to fill the screen -->
<div #sheet class="sheet" aria-hidden="true">
  <span class="sheet-frame"></span>
  <span class="sheet-card">
    <span #sheetNames class="sheet-names">{{ names()[0] }} <span class="script-amp">&amp;</span> {{ names()[1] }}</span>
    <span class="sheet-rule"></span>
    <span class="sheet-date">{{ dateLine() }}</span>
  </span>
</div>

<canvas #fx class="fx" aria-hidden="true"></canvas>
